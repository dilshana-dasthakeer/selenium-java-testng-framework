name: Unpack project zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip into the repository
        run: |
          set -e
          zip=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$zip" ]; then echo "No zip to unpack"; exit 0; fi
          mkdir /tmp/project
          unzip -q "$zip" -d /tmp/project
          src=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n1)
          rm -rf "$src/.github"
          shopt -s dotglob
          cp -r "$src"/* .
          rm -f "$zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add project files"
          git push
