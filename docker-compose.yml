# Local Selenium Grid with Chrome, Firefox and Edge nodes.
#   docker compose up -d
#   mvn test -Dgrid.url=http://localhost:4444 -Dbrowser=firefox
#   docker compose down
# Grid UI: http://localhost:4444
services:
  selenium-hub:
    image: selenium/hub:4.35.0
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  chrome:
    image: selenium/node-chrome:4.35.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment: &node-env
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "3"

  firefox:
    image: selenium/node-firefox:4.35.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment: *node-env

  edge:
    image: selenium/node-edge:4.35.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment: *node-env
